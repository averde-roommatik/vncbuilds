name: Build & release VNC viewers for Windows

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      product:
        description: 'Which product to build'
        required: false
        type: choice
        options: [both, tigervnc, ultravnc]
        default: both
      target:
        description: 'What to build'
        required: false
        type: choice
        options: [both, stable, rc]
        default: both
      force:
        description: 'Rebuild and re-release even if the tag already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TIGER_UPSTREAM: https://github.com/TigerVNC/tigervnc.git
  ULTRA_UPSTREAM: https://github.com/ultravnc/UltraVNC.git
  RC_KEEP: 10

jobs:
  # ───────────────────────────── TigerVNC ─────────────────────────────

  check-tigervnc:
    # Always runs regardless of the product input — release-combined needs both
    # products' current tag/version even on a run scoped to just one of them.
    runs-on: ubuntu-latest
    outputs:
      stable_upstream_ref: ${{ steps.v.outputs.stable_upstream_ref }}
      stable_tag: ${{ steps.v.outputs.stable_tag }}
      rc_tag: ${{ steps.v.outputs.rc_tag }}
      rc_sha_full: ${{ steps.v.outputs.rc_sha_full }}
      build_stable: ${{ steps.v.outputs.build_stable }}
      build_rc: ${{ steps.v.outputs.build_rc }}
      channels: ${{ steps.v.outputs.channels }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          TARGET="${TARGET:-both}"

          STABLE_UPSTREAM_REF=$(git ls-remote --tags --sort=-v:refname "$TIGER_UPSTREAM" \
            | awk -F/ '{print $NF}' | grep -v '\^{}' | head -1)
          MASTER_SHA_FULL=$(git ls-remote "$TIGER_UPSTREAM" refs/heads/master | cut -f1)
          MASTER_SHA_SHORT=$(echo "$MASTER_SHA_FULL" | cut -c1-7)

          STABLE_TAG="tiger-${STABLE_UPSTREAM_REF}"
          RC_TAG="tiger-${STABLE_UPSTREAM_REF}-rc.g${MASTER_SHA_SHORT}"

          echo "stable_upstream_ref=$STABLE_UPSTREAM_REF" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"
          echo "rc_sha_full=$MASTER_SHA_FULL" >> "$GITHUB_OUTPUT"

          want_stable=false
          want_rc=false
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "stable" ]; then want_stable=true; fi
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "rc" ]; then want_rc=true; fi

          stable_exists=false
          if gh release view "$STABLE_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            stable_exists=true
          fi
          rc_exists=false
          if gh release view "$RC_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            rc_exists=true
          fi

          build_stable=false
          if [ "$want_stable" = "true" ]; then
            if [ "$FORCE" = "true" ] || [ "$stable_exists" = "false" ]; then
              build_stable=true
            fi
          fi

          build_rc=false
          if [ "$want_rc" = "true" ]; then
            if [ "$FORCE" = "true" ] || [ "$rc_exists" = "false" ]; then
              build_rc=true
            fi
          fi

          echo "build_stable=$build_stable" >> "$GITHUB_OUTPUT"
          echo "build_rc=$build_rc" >> "$GITHUB_OUTPUT"

          channels="[]"
          if [ "$build_stable" = "true" ] && [ "$build_rc" = "true" ]; then
            channels='["stable","rc"]'
          elif [ "$build_stable" = "true" ]; then
            channels='["stable"]'
          elif [ "$build_rc" = "true" ]; then
            channels='["rc"]'
          fi
          echo "channels=$channels" >> "$GITHUB_OUTPUT"

  build-tigervnc:
    needs: check-tigervnc
    if: |
      needs.check-tigervnc.outputs.channels != '[]' &&
      (github.event_name == 'schedule' || inputs.product == 'both' || inputs.product == 'tigervnc')
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.check-tigervnc.outputs.channels) }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable Git autocrlf
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          repository: TigerVNC/tigervnc
          ref: ${{ matrix.channel == 'stable' && needs.check-tigervnc.outputs.stable_upstream_ref || 'master' }}
      - uses: actions/checkout@v7
        with:
          path: _self
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          cache: false
      - name: Apply compatibility patches (if still needed)
        run: |
          for i in 1 2 3; do
            pacman --sync --noconfirm --needed patch && break
            echo "pacman failed (attempt $i/3), retrying in 15s..."
            sleep 15
          done
          for p in _self/patches-tigervnc/*.patch; do
            [ -e "$p" ] || continue
            tmp=$(mktemp)
            sed 's/\r$//' "$p" > "$tmp"
            if patch -p1 --dry-run < "$tmp" > /tmp/patch-check.log 2>&1; then
              echo "Applying $p"
              patch -p1 < "$tmp"
            else
              echo "::warning::$p did not apply cleanly — expected once upstream ships this fix, otherwise see reason below"
              cat /tmp/patch-check.log
            fi
            rm -f "$tmp"
          done
      - name: Install dependencies
        run: |
          pkg_install() {
            for i in 1 2 3; do
              pacman --sync --noconfirm --needed "$@" && return 0
              echo "pacman failed (attempt $i/3), retrying in 15s..."
              sleep 15
            done
            return 1
          }
          pkg_install make mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
          pkg_install mingw-w64-x86_64-fltk1.3 mingw-w64-x86_64-libjpeg-turbo \
            mingw-w64-x86_64-gnutls mingw-w64-x86_64-pixman \
            mingw-w64-x86_64-nettle mingw-w64-x86_64-gmp
      - name: Configure
        run: |
          cmake -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NLS=ON -DENABLE_H264=ON -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON -DENABLE_NETTLE=ON -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Smoke test
        working-directory: build
        run: timeout 15 ./vncviewer/vncviewer.exe --version
      - name: Resolve runtime DLLs
        run: |
          if ldd build/vncviewer/vncviewer.exe | grep -qi "not found"; then
            echo "::error::vncviewer.exe has unresolved DLL dependencies:"
            ldd build/vncviewer/vncviewer.exe | grep -i "not found"
            exit 1
          fi

          ldd build/vncviewer/vncviewer.exe \
            | awk '{print $3}' \
            | grep -iE '^/(mingw64|usr)/' \
            | sort -u > dll-list.txt

          echo "Resolved runtime DLLs:"
          cat dll-list.txt
      - name: Package portable build
        run: |
          mkdir -p portable
          cp build/vncviewer/vncviewer.exe portable/tiger-vncviewer.exe

          while read -r dll; do
            cp "$dll" portable/
          done < dll-list.txt

          echo "Portable package contents:"
          ls -la portable/

          pacman --sync --noconfirm --needed zip
          (cd portable && zip -r ../tiger-vncviewer-portable.zip .)
      - name: Package installer
        working-directory: build
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          while read -r dll; do
            win_path=$(cygpath -w "$dll")
            echo "Source: \"$win_path\"; DestDir: \"{app}\"; Flags: ignoreversion" >> extra_files.iss
          done < ../dll-list.txt

          sed -i "/restartreplace/r extra_files.iss" release/tigervnc.iss

          make installer
          cp release/tigervnc*.exe ../tiger-vncviewer.exe
      - name: Checksum
        run: sha256sum tiger-vncviewer.exe tiger-vncviewer-portable.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tiger-vncviewer-${{ matrix.channel }}
          path: |
            tiger-vncviewer.exe
            tiger-vncviewer-portable.zip
            SHA256SUMS.txt

  release-tigervnc-stable:
    needs: [check-tigervnc, build-tigervnc]
    if: needs.check-tigervnc.outputs.build_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tiger-vncviewer-stable
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-tigervnc.outputs.stable_tag }}
          name: tiger-vncviewer ${{ needs.check-tigervnc.outputs.stable_upstream_ref }} (stable)
          prerelease: false
          make_latest: false
          body: |
            Windows build of TigerVNC's `vncviewer`, compiled from the official
            [`${{ needs.check-tigervnc.outputs.stable_upstream_ref }}`](https://github.com/TigerVNC/tigervnc/tree/${{ needs.check-tigervnc.outputs.stable_upstream_ref }}) release tag.

            - `tiger-vncviewer.exe` — installer
            - `tiger-vncviewer-portable.zip` — no install needed, just extract and run

            Not built or endorsed by the TigerVNC project — see [`SHA256SUMS.txt`](../../releases/download/${{ needs.check-tigervnc.outputs.stable_tag }}/SHA256SUMS.txt) to verify the download.
          files: |
            tiger-vncviewer.exe
            tiger-vncviewer-portable.zip
            SHA256SUMS.txt

  release-tigervnc-rc:
    needs: [check-tigervnc, build-tigervnc]
    if: needs.check-tigervnc.outputs.build_rc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tiger-vncviewer-rc
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-tigervnc.outputs.rc_tag }}
          name: tiger-vncviewer — master @ ${{ needs.check-tigervnc.outputs.rc_sha_full }}
          prerelease: true
          make_latest: false
          body: |
            Rolling Windows build of TigerVNC's `vncviewer`, compiled from
            upstream [`master`](https://github.com/TigerVNC/tigervnc/commit/${{ needs.check-tigervnc.outputs.rc_sha_full }}) at this commit.

            - `tiger-vncviewer.exe` — installer
            - `tiger-vncviewer-portable.zip` — no install needed, just extract and run

            ⚠️ Development build, not an official TigerVNC release — see [`SHA256SUMS.txt`](../../releases/download/${{ needs.check-tigervnc.outputs.rc_tag }}/SHA256SUMS.txt) to verify the download.
          files: |
            tiger-vncviewer.exe
            tiger-vncviewer-portable.zip
            SHA256SUMS.txt

  cleanup-tigervnc-rc:
    needs: [check-tigervnc, release-tigervnc-rc]
    if: needs.check-tigervnc.outputs.build_rc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the last N rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh release list -R "$REPO" --limit 500 --json tagName,createdAt \
            | jq -r --argjson keep "$RC_KEEP" \
                '[.[] | select(.tagName | test("^tiger-.*-rc\\.g"))]
                 | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting old rolling release: $tag"
                gh release delete "$tag" -R "$REPO" -y --cleanup-tag
              done

  # ───────────────────────────── UltraVNC ─────────────────────────────

  check-ultravnc:
    # Always runs regardless of the product input — release-combined needs both
    # products' current tag/version even on a run scoped to just one of them.
    runs-on: ubuntu-latest
    outputs:
      stable_sha_full: ${{ steps.v.outputs.stable_sha_full }}
      stable_version: ${{ steps.v.outputs.stable_version }}
      stable_tag: ${{ steps.v.outputs.stable_tag }}
      build_stable: ${{ steps.v.outputs.build_stable }}
      channels: ${{ steps.v.outputs.channels }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          TARGET="${TARGET:-both}"

          # UltraVNC has no tags/releases, and no reliable per-version branch either —
          # uvnc.com's actual latest release (1.8.2.4) is older than what main itself
          # currently reports, and the only other branch on the repo is an in-progress
          # future-version candidate, not a shipped release. main is the only ref we
          # can build with any confidence, so it's what we treat as "stable" here —
          # there's no meaningful "rc" to build in addition to it.
          get_version() {
            local ref="$1"
            local inc
            inc=$(curl -sf "https://raw.githubusercontent.com/ultravnc/UltraVNC/${ref}/common/versionServerViewer.inc")
            local maj min bld mod
            maj=$(echo "$inc" | grep -oP 'APS_MAJORNUMBER\s+\K[0-9]+')
            min=$(echo "$inc" | grep -oP 'APS_MINORNUMBER\s+\K[0-9]+')
            bld=$(echo "$inc" | grep -oP 'APS_BUILDNUMBER\s+\K[0-9]+')
            mod=$(echo "$inc" | grep -oP 'APS_MODIFICATIONNUMBER\s+\K[0-9]+')
            echo "${maj}.${min}.${bld}.${mod}"
          }

          STABLE_SHA_FULL=$(git ls-remote "$ULTRA_UPSTREAM" refs/heads/main | cut -f1)
          STABLE_VERSION=$(get_version "$STABLE_SHA_FULL")
          STABLE_TAG="ultra-v${STABLE_VERSION}"

          echo "stable_sha_full=$STABLE_SHA_FULL" >> "$GITHUB_OUTPUT"
          echo "stable_version=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"

          want_stable=false
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "stable" ]; then want_stable=true; fi

          stable_exists=false
          if gh release view "$STABLE_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            stable_exists=true
          fi

          build_stable=false
          if [ "$want_stable" = "true" ]; then
            if [ "$FORCE" = "true" ] || [ "$stable_exists" = "false" ]; then
              build_stable=true
            fi
          fi

          echo "build_stable=$build_stable" >> "$GITHUB_OUTPUT"

          channels="[]"
          if [ "$build_stable" = "true" ]; then
            channels='["stable"]'
          fi
          echo "channels=$channels" >> "$GITHUB_OUTPUT"

  build-ultravnc:
    needs: check-ultravnc
    if: |
      needs.check-ultravnc.outputs.channels != '[]' &&
      (github.event_name == 'schedule' || inputs.product == 'both' || inputs.product == 'ultravnc')
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.check-ultravnc.outputs.channels) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Disable Git autocrlf
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          repository: ultravnc/UltraVNC
          ref: main
      - uses: actions/checkout@v7
        with:
          path: _self
      - uses: ilammy/setup-nasm@v1
      - uses: microsoft/setup-msbuild@v2
      - name: Resolve an MSVC toolset with MFC/ATL
        id: toolset
        shell: pwsh
        run: |
          # vncviewer.vcxproj pins an old PlatformToolset (v142) via its own project
          # files. That specific side-by-side toolset doesn't ship MFC/ATL on this
          # runner image, even though a newer installed toolset does — so retarget
          # the whole solution to whichever installed toolset actually has it,
          # rather than trying to install MFC for the old pinned one.
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vsPath = & "$vsInstaller\vswhere.exe" -latest -products * -property installationPath
          Write-Host "VS install path: $vsPath"

          $toolsets = Get-ChildItem (Join-Path $vsPath "VC\Tools\MSVC") -Directory |
            Sort-Object { [version]$_.Name } -Descending
          Write-Host "Installed toolsets: $($toolsets.Name -join ', ')"

          $chosen = $toolsets | Where-Object { Test-Path (Join-Path $_.FullName "atlmfc\lib\x64") } | Select-Object -First 1
          if (-not $chosen) {
            throw "No installed MSVC toolset has atlmfc\lib\x64 (vncviewer is an MFC app)"
          }

          $minor = $chosen.Name.Split('.')[1]
          $platformToolset = "v14$($minor.Substring(0,1))"
          Write-Host "Using toolset $($chosen.Name) -> PlatformToolset=$platformToolset"
          "platform_toolset=$platformToolset" >> $env:GITHUB_OUTPUT
      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
      - name: Apply compatibility patches (if still needed)
        shell: bash
        run: |
          for p in _self/patches-ultravnc/*.patch; do
            [ -e "$p" ] || continue
            tmp=$(mktemp)
            sed 's/\r$//' "$p" > "$tmp"
            if patch -p1 --dry-run < "$tmp" > /tmp/patch-check.log 2>&1; then
              echo "Applying $p"
              patch -p1 < "$tmp"
            else
              echo "::warning::$p did not apply cleanly — expected once upstream ships this fix, otherwise see reason below"
              cat /tmp/patch-check.log
            fi
            rm -f "$tmp"
          done
      - name: Build vncviewer
        shell: pwsh
        run: |
          msbuild vncviewer\vncviewer.sln /p:Configuration=Release /p:Platform=x64 /m `
            /p:PlatformToolset=${{ steps.toolset.outputs.platform_toolset }}
      - name: Locate build output
        id: out
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path vncviewer -Filter vncviewer.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "vncviewer.exe not found after build" }
          Write-Host "Found: $($exe.FullName)"
          "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "${{ steps.out.outputs.exe_path }}" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) { throw "vncviewer.exe exited immediately (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item "${{ steps.out.outputs.exe_path }}" "portable\ultra-vncviewer.exe"
          Compress-Archive -Path portable\* -DestinationPath ultra-vncviewer-portable.zip
      - name: Package installer
        shell: pwsh
        run: |
          $iconPath = (Resolve-Path "vncviewer\res\idr_tray.ico").Path
          & iscc /DMyAppVersion="${{ needs.check-ultravnc.outputs.stable_version }}" `
            /DSourceExe="${{ steps.out.outputs.exe_path }}" `
            /DSourceIcon="$iconPath" `
            /O"." /F"ultra-vncviewer" `
            _self\installer\ultravnc-viewer.iss
      - name: Checksum
        shell: pwsh
        run: |
          Get-FileHash ultra-vncviewer.exe, ultra-vncviewer-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ultra-vncviewer-${{ matrix.channel }}
          path: |
            ultra-vncviewer.exe
            ultra-vncviewer-portable.zip
            SHA256SUMS.txt

  release-ultravnc-stable:
    needs: [check-ultravnc, build-ultravnc]
    if: needs.check-ultravnc.outputs.build_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ultra-vncviewer-stable
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-ultravnc.outputs.stable_tag }}
          name: ultra-vncviewer ${{ needs.check-ultravnc.outputs.stable_version }}
          prerelease: false
          make_latest: false
          body: |
            Windows build of UltraVNC's `vncviewer`, compiled from upstream
            [`main`](https://github.com/ultravnc/UltraVNC/commit/${{ needs.check-ultravnc.outputs.stable_sha_full }}) at this commit
            (reports itself as version `${{ needs.check-ultravnc.outputs.stable_version }}` per its own
            `common/versionServerViewer.inc`).

            UltraVNC publishes no upstream tags/releases, and no other branch reliably maps to a
            shipped version either — `main` is what this pipeline tracks.

            Viewer only — this does **not** include the UltraVNC server, repeater, or drivers.

            - `ultra-vncviewer.exe` — installer
            - `ultra-vncviewer-portable.zip` — no install needed, just extract and run

            Not built or endorsed by the UltraVNC project — see [`SHA256SUMS.txt`](../../releases/download/${{ needs.check-ultravnc.outputs.stable_tag }}/SHA256SUMS.txt) to verify the download.
          files: |
            ultra-vncviewer.exe
            ultra-vncviewer-portable.zip
            SHA256SUMS.txt

  # ──────────────────────── Combined "latest" release ────────────────────────
  # A single always-updated release bundling both products' current stable build,
  # so fetching "latest release" via the API returns both in one place. Whichever
  # product didn't change this run reuses its already-published assets instead of
  # being rebuilt.

  release-combined:
    needs: [check-tigervnc, check-ultravnc, build-tigervnc, build-ultravnc, release-tigervnc-stable, release-ultravnc-stable]
    if: |
      always() &&
      (needs.check-tigervnc.result == 'success' || needs.check-tigervnc.result == 'skipped') &&
      (needs.check-ultravnc.result == 'success' || needs.check-ultravnc.result == 'skipped') &&
      (needs.check-tigervnc.outputs.build_stable == 'true' || needs.check-ultravnc.outputs.build_stable == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reuse TigerVNC's last stable release (only if not rebuilt this run)
        if: needs.check-tigervnc.outputs.build_stable != 'true'
        run: |
          mkdir -p tiger-assets
          TAG="${{ needs.check-tigervnc.outputs.stable_tag }}"
          if [ -n "$TAG" ] && gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$TAG" -R "${{ github.repository }}" -D tiger-assets --clobber
          else
            echo "::warning::No existing TigerVNC stable release ($TAG) to reuse — it will be missing from the combined release"
          fi
      - uses: actions/download-artifact@v8
        if: needs.check-tigervnc.outputs.build_stable == 'true'
        with:
          name: tiger-vncviewer-stable
          path: tiger-assets
      - name: Reuse UltraVNC's last stable release (only if not rebuilt this run)
        if: needs.check-ultravnc.outputs.build_stable != 'true'
        run: |
          mkdir -p ultra-assets
          TAG="${{ needs.check-ultravnc.outputs.stable_tag }}"
          if [ -n "$TAG" ] && gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$TAG" -R "${{ github.repository }}" -D ultra-assets --clobber
          else
            echo "::warning::No existing UltraVNC stable release ($TAG) to reuse — it will be missing from the combined release"
          fi
      - uses: actions/download-artifact@v8
        if: needs.check-ultravnc.outputs.build_stable == 'true'
        with:
          name: ultra-vncviewer-stable
          path: ultra-assets
      - name: Assemble combined release files
        run: |
          mkdir -p combined
          cp tiger-assets/tiger-vncviewer.exe tiger-assets/tiger-vncviewer-portable.zip combined/ 2>/dev/null || true
          cp ultra-assets/ultra-vncviewer.exe ultra-assets/ultra-vncviewer-portable.zip combined/ 2>/dev/null || true
          : > combined/SHA256SUMS.txt
          cat tiger-assets/SHA256SUMS.txt >> combined/SHA256SUMS.txt 2>/dev/null || true
          cat ultra-assets/SHA256SUMS.txt >> combined/SHA256SUMS.txt 2>/dev/null || true
          echo "Combined release will contain:"
          ls -la combined/
          [ -s combined/SHA256SUMS.txt ] || { echo "::error::Nothing to publish — both products missing"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest builds — TigerVNC ${{ needs.check-tigervnc.outputs.stable_upstream_ref }} + UltraVNC ${{ needs.check-ultravnc.outputs.stable_version }}
          prerelease: false
          make_latest: true
          body: |
            Always-updated release bundling the current stable build of **both** viewers, so
            fetching "the latest release" via the GitHub API returns both in one place instead
            of two separate per-product releases.

            - TigerVNC `${{ needs.check-tigervnc.outputs.stable_upstream_ref }}` — full notes at [`${{ needs.check-tigervnc.outputs.stable_tag }}`](../../releases/tag/${{ needs.check-tigervnc.outputs.stable_tag }})
            - UltraVNC `${{ needs.check-ultravnc.outputs.stable_version }}` — full notes at [`${{ needs.check-ultravnc.outputs.stable_tag }}`](../../releases/tag/${{ needs.check-ultravnc.outputs.stable_tag }})

            Whichever product didn't change since the last run keeps its previously-built
            binary here rather than being rebuilt — the individually-tagged releases above
            remain the source of truth for exactly what's in each.
          files: combined/*
